<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Preview exportieren</title>
  <style>
    body { margin: 0; background: #333; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px; font-family: sans-serif; }
    canvas { display: block; max-width: 100%; border: 1px solid #555; }
    button { padding: 12px 24px; background: #bf6a3c; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    p { color: #ccc; font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <p>Vorschaubild 1200 × 630 px – als preview.png speichern und im Projektordner ablegen.</p>
  <canvas id="c" width="1200" height="630"></canvas>
  <button onclick="download()">preview.png herunterladen</button>
  <p>Anschliessend in index.html die DEINE-DOMAIN Platzhalter durch die echte Domain ersetzen.</p>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    const W = 1200, H = 630;
    const BG        = '#f7f1e8';
    const ACCENT    = '#bf6a3c';
    const TEXT      = '#231f1a';
    const MUTED     = '#6d6258';
    const SUBTLE    = '#9e9088';
    const LINE_SOFT = '#e6dbcf';

    const X = 160; // left margin

    // Background
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Top accent strip
    ctx.fillStyle = ACCENT;
    ctx.fillRect(0, 0, W, 6);

    // Title
    ctx.fillStyle = TEXT;
    ctx.font = '700 68px Georgia, serif';
    ctx.letterSpacing = '-1px';
    ctx.fillText('Arbeitsrealität', X, 210);

    // Accent divider
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.roundRect(X, 234, 72, 5, 2);
    ctx.fill();

    // Questions
    ctx.letterSpacing = '0px';
    ctx.fillStyle = TEXT;
    ctx.font = '700 46px -apple-system, "Helvetica Neue", Arial, sans-serif';
    ctx.fillText('Was läuft gut?', X, 330);

    ctx.fillStyle = MUTED;
    ctx.font = '400 44px -apple-system, "Helvetica Neue", Arial, sans-serif';
    ctx.fillText('Wo verlierst du Zeit oder Nerven?', X, 392);

    // Footer
    ctx.fillStyle = SUBTLE;
    ctx.font = '400 26px -apple-system, "Helvetica Neue", Arial, sans-serif';
    ctx.fillText('3–5 Minuten · anonym', X, 500);

    function download() {
      const a = document.createElement('a');
      a.download = 'preview.png';
      a.href = c.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
